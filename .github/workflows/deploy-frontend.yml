name: Desplegar frontend en producción

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: https://api.lemokaicoffe.com.co/api
      S3_BUCKET: lemokaicoffe-frontend-prod
      DISTRIBUTION_ID: E1KCF8857GT7C3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compilar frontend
        run: |
          npm ci
          npm run build

      - name: Diagnosticar identidad OIDC
        shell: bash
        run: |
          node <<'NODE'
          async function main() {
            const endpoint = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;

            if (!endpoint || !requestToken) {
              throw new Error("No están disponibles las variables OIDC.");
            }

            const url = new URL(endpoint);
            url.searchParams.set("audience", "sts.amazonaws.com");

            const response = await fetch(url, {
              headers: {
                Authorization: `Bearer ${requestToken}`,
              },
            });

            if (!response.ok) {
              throw new Error(`La solicitud OIDC respondió HTTP ${response.status}.`);
            }

            const payload = await response.json();

            if (typeof payload.value !== "string") {
              throw new Error("GitHub no devolvió el token OIDC esperado.");
            }

            const encodedClaims = payload.value.split(".")[1];

            if (!encodedClaims) {
              throw new Error("El token OIDC tiene un formato inesperado.");
            }

            const claims = JSON.parse(
              Buffer.from(encodedClaims, "base64url").toString("utf8")
            );

            console.log(JSON.stringify({
              iss: claims.iss,
              aud: claims.aud,
              sub: claims.sub,
              repository: claims.repository,
              ref: claims.ref,
            }, null, 2));
          }

          main().catch(() => {
            console.error("No se pudo completar el diagnóstico OIDC.");
            process.exitCode = 1;
          });
          NODE

      - name: Autenticarse en AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::828573071368:role/lemokaicoffe-github-frontend-prod
          aws-region: us-west-2

      - name: Publicar en S3 y actualizar CloudFront
        run: |
          aws s3 sync dist/ "s3://$S3_BUCKET/" --exclude "index.html" --only-show-errors
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" --cache-control "no-cache" --only-show-errors
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" --paths "/*" \
            --query "Invalidation.Id" --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" --id "$invalidation_id"
